    reason: not stored in the bundle or in any checkpoint
  - field: per-epoch learning-rate trace
    reason: >-
      `history` records epoch, train_total, train_rep, train_wm, val_rep and
      val_wm only. The learning rate is recoverable per stage from the SLURM
      scripts and from lr_at_save, but not as a per-epoch series.
  - field: exact CUDA/cuDNN library versions
    reason: >-
      the SLURM module (pytorch-gpu/py3/2.6.0) and the GPU model (V100) are
      recorded; the resolved library versions are not.
