selection:
  # The current canonical policy and the policy under which the archived bundle
  # was created are NOT the same. Both are recorded; neither is rewritten.
  current_canonical_policy:
    criterion: X=5
    definition: >-
      A seed qualifies when it shows at least 5 consecutive zero-whole-word-error
      FULL evaluations on the 29,571-word training lexicon. The selected
      checkpoint is the first checkpoint of the qualifying streak.
    qualifying_seeds: [19, 22]
  archived_bundle_policy:
    criterion: X=2
    definition: >-
      A seed qualified when it showed at least 2 consecutive zero-error
      evaluations. This is the criterion under which
      control/experiment_manifest.json and bundle_manifest.json were written.
    qualifying_seeds: [19, 20, 22]
    note: >-
      The archived bundle manifest is historical and is not rewritten. It
      records 3 seeds as stable-zero under X=2 and lists all four selected
      checkpoints with role "primary".
  effect_of_raising_x: >-
    Raising the criterion from X=2 to X=5 does not change any selected epoch.
    Seeds 19 and 22 keep epochs 155 and 140 at every X; only cohort membership
    changes. Observed zero streaks were: seed 19 = 6 (155-180), seed 20 = 2
    (130-135), seed 21 = 0, seed 22 = 13 (140-200).
  selection_rule_within_a_seed:
    - earliest checkpoint beginning the first qualifying zero streak
    - else earliest exact-zero checkpoint
    - else earliest checkpoint with the minimum error count

canonical_selection_policy: X=5

