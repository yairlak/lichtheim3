training:
  optimizer: AdamW                                         # EXACTLY_RECOVERED (train.py:190, train_checkpoint.py:693, manifest)
  optimizer_betas: [0.9, 0.999]                            # EXACTLY_RECOVERED (saved optimizer param_groups)
  optimizer_eps: 1.0e-08                                   # EXACTLY_RECOVERED
  amsgrad: false                                           # EXACTLY_RECOVERED
  weight_decay: 1.0e-05                                    # EXACTLY_RECOVERED
  grad_clip: 1.0                                           # EXACTLY_RECOVERED
  batch_size: 64                                           # EXACTLY_RECOVERED
  teacher_forcing_ratio: 1.0                               # EXACTLY_RECOVERED
  dorsal_pool_size: 4000                                   # EXACTLY_RECOVERED
  num_workers: 0                                           # EXACTLY_RECOVERED
  log_every: 50                                            # EXACTLY_RECOVERED
  total_epochs: 200                                        # EXACTLY_RECOVERED
  device: cuda                                             # EXACTLY_RECOVERED (NVIDIA V100, Jean Zay)

  # The learning-rate change is NOT a scheduler. It is a two-job boundary:
  # stage 2 resumes the stage-1 checkpoint and constructs a fresh AdamW at the
  # new learning rate, then loads the stage-1 optimizer state.
  lr_schedule:
    kind: two_stage_job_boundary                           # EXACTLY_RECOVERED
    stage_1:
      epochs: [1, 100]
      lr: 1.0e-03
      save_every_epochs: 0
      output: seed_<seed>_e100.pt
    stage_2:
      epochs: [101, 200]
      lr: 1.0e-04
      resume_from_stage_1: true
      save_every_epochs: 5
      output: seed_<seed>.pt
    transition_rule: >-
      Stage 1 runs epochs 1-100 at lr 1e-3 and stops. Stage 2 is a separate
      SLURM job that resumes seed_<seed>_e100.pt with --lr 1e-4 and trains to a
      target total of 200 epochs. There is no in-run scheduler and no warmup or
      decay between the two values.

  seed_policy:
    seeds: [19, 20, 21, 22]                                # EXACTLY_RECOVERED
    cfg_train_seed: <seed>                                 # equals the cohort seed
    cfg_data_seed: <seed>                                  # equals the cohort seed
    split_seed_configured: 0
    split_seed_effective: null
    note: >-
      cfg_data.seed and cfg_train.seed are both set to the cohort seed. The
      split seed is configured but never used because full_lexicon mode draws
      no split. RNG states for torch, numpy and cuda are stored in every
      checkpoint under `rng_states`.

  # These are the exact commands recorded in the archived SLURM scripts.
  # Unlike this file, they are executable.
  reproduction_commands:
    stage_1: >-
      python scripts/train_checkpoint.py
      --lexicon_path data/lexicon_en_glove_covered.tsv
      --max_words 30000 --train_all_words
      --epochs 100 --seed <seed> --split_seed 0
      --batch_size 64 --lr 1e-3 --num_workers 0 --save_every_epochs 0
      --ltm_encoder_mode unigru_last_hidden --hidden_size 128
      --teacher_forcing_ratio 1.0 --interference_noise 0.0 --ventral_noise 0.0
      --gate_alpha 2.0 --gate_threshold 0.7
      --ckpt <ckpt_root>/seed_<seed>_e100.pt --out_dir <run_dir>
    stage_2: >-
      python scripts/train_checkpoint.py
      --resume_from <ckpt_root>/seed_<seed>_e100.pt
      --epochs 200 --lr 1e-4 --num_workers 0 --save_every_epochs 5
      --ckpt <ckpt_root>/seed_<seed>.pt --out_dir <run_dir>
    note: >-
      Stage 2 passes only the flags it overrides; every architectural setting is
      restored from the stage-1 checkpoint, not from config.py defaults.

  environment:
    platform: IDRIS Jean Zay
    scheduler: SLURM
    partition: gpu_p13
    gpu: NVIDIA V100
    cpus_per_task: 10
    module: pytorch-gpu/py3/2.6.0
    omp_num_threads: 10
    note: >-
      The environment is recorded for provenance. It is not required: the recipe
      is not documented as depending on any Jean Zay specific behaviour.

