# ============================================================================
# Canonical Lichtheim3 full-lexicon repetition training recipe — cohort 93a577f
#
# THIS IS A PROVENANCE RECORD, NOT AN EXECUTABLE CONFIG FILE.
#
# No code in this repository reads this file. `config.py` does not load YAML,
# and `scripts/train_checkpoint.py` is driven entirely by command-line flags.
# The `training.reproduction_commands` block below carries the actual commands
# that produced the cohort; those are executable, this file is not.
#
# Every value marked EXACTLY_RECOVERED was read from primary historical
# evidence, in this priority order:
#   1. configuration dictionaries embedded in the four archived checkpoints
#   2. the archived bundle manifest and SLURM submission scripts
#   3. the training code at commit 93a577f
#   4. the Phase 4 frozen historical-configuration block (cross-check only)
#
# Source 4 was used only to confirm values already established by 1-3. It
# introduced no value of its own.
# ============================================================================

