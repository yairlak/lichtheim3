  teacher_forced_use: ceiling_debug_only
  do_not_train_on:
    - WFE
    - SSP

current_attested_architecture:
  phon_embed_dim: 64
  wm_hidden_dim: 128
  ltm_encoder_type: biGRU  # CURRENT; proposed: uniGRU after Phase 2 patch
  ltm_encoder_hidden_dim_per_direction: 256  # biGRU: 256/dir → 512 out; uniGRU: 256 out
  ltm_decoder_hidden_dim: 256
  semantic_dim: 300
  premotor_dim: 128  # HARDCODED default arg in DualRouteModel.__init__; NOT in config
  gate_alpha_default: 4.0  # GatingConfig.alpha; CLI: --gate_alpha CONFIRMED
  gate_threshold: 0.5  # HARD-CODED Python literal in gating.py:45; NOT in GatingConfig — PENDING_IMPLEMENTATION
  wm_interference_noise_default: 0.10  # WMConfig.interference_noise; CLI: --interference_noise CONFIRMED
  ventral_noise_ltm: 0.0  # NOT IMPLEMENTED anywhere — PENDING_IMPLEMENTATION
  gate_is_learned: false
  ltm_bigru_packing: false  # known artifact; replaced by uniGRU proposal (not packing fix)
  ltm_encoder_uses_last_hidden: false  # CURRENT uses masked mean pool; PROPOSED: last hidden — PENDING_IMPLEMENTATION

