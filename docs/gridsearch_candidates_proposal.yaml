  training_runs: 0
  evaluations:
    - train_teacher_forced_no_noise
    - train_autoregressive_no_noise
    - val_teacher_forced_no_noise
    - val_autoregressive_no_noise
    - wfe_teacher_forced_no_noise
    - wfe_autoregressive_no_noise
    - route_isolated_full_wm_ltm
    - deterministic_repeat_check
    - length_effect_analysis
    - check_regime_c_ar_plus_wm_noise_status

phase4_main_grid:
  # H × TF × LR = 18 runs
  # Requires Phase 2 patch to be complete (uniGRU + --hidden_size flag)
  status: PENDING_PHASE2_PATCH

  fixed:
    seed: 0
    epochs: 30  # screening run; extend in Phase 8
    sigma_wm: 0.0  # noise off for Phase 4
    sigma_ltm: 0.0  # noise off for Phase 4
    gate_alpha: 4.0
    gate_threshold: 0.5
    batch_size: 64
    dropout: NOT_IMPLEMENTED

  candidates:
    hidden_size:  # unified H for WM and LTM (requires Phase 2 uniGRU patch)
      - 64
      - 128
      - 256
    teacher_forcing_ratio:
      - 1.0   # full TF = historical baseline
      - 0.2   # scheduled sampling; ~5× slower
      - 0.0   # fully AR = SWP/Dager-aligned; ~10× slower
    learning_rate:
      - 0.001
      - 0.0005

  total_runs: 18  # 3 × 3 × 2

  run_id_convention: "p4_H{hidden_size:03d}_tf{tf_ratio}_lr{lr}_s{seed}"
  example_run_ids:
    - p4_H064_tf1p0_lr1e-3_s0
    - p4_H128_tf0p2_lr5e-4_s0
    - p4_H256_tf0p0_lr1e-3_s0

  boundary_extension_rule: |
    If Phase 4 winner is at a boundary of any dimension, extend before concluding:
    - H=256 wins: add H=512 run before declaring winner
    - H=64 wins: add H=32 run (but note phon_embed_dim=64; H<64 may be problematic)
    - TF=0.0 wins: no extension needed (0.0 is theoretical minimum)
    - TF=1.0 wins: consider brief check at TF=0.5 if TF=0.2 was close
    - LR=5e-4 wins: add LR=2e-4 run
    - LR=1e-3 wins: add LR=2e-3 run (with caution — instability risk)

phase5_multi_seed:
  # Top 2 Phase 4 configs × 3 seeds = 6 runs
  status: PENDING_PHASE4
  seeds: [0, 1, 2]
  note: "Different seeds = different train/val splits. Report as 'mean ± SE across seeds with different data partitions.'"
  top_n_from_phase4: 2
  total_runs: 6

phase6_noise_grid:
  # WM × LTM noise grid; requires encode-once fix if best TF<1
  status: PENDING_PHASE5
  blocking_condition: "encode-once fix in train.py if TF<1 was selected in Phase 4"
  candidates:
    sigma_wm: [0.0, 0.05, 0.10]
    sigma_ltm: [0.0, 0.05]
  total_runs: 6  # 3 × 2; fixed at best H/TF/LR from Phase 5

phase7_gate_grid:
  # alpha × threshold grid; requires confidence distribution logged from Phase 4-5
  status: PENDING_PHASE6
  blocking_condition: "confidence distribution for real/pseudowords must be logged and inspected before interpreting gate grid"
  candidates:
    gate_alpha: [2.0, 4.0, 8.0]
    gate_threshold: [0.3, 0.5, 0.7]
  total_runs: 9  # 3 × 3; requires gate_threshold in GatingConfig (Phase 2 patch)

selection_metrics:
  primary:
    # FULL route only — WM/LTM routes are diagnostic only for model selection
    - train_exact_match_ar_full
    - val_exact_match_ar_full
    - val_edit_distance_ar_full
    - val_normalized_edit_distance_ar_full
    - wfe_real_seen_exact_match_ar_full
    - wfe_pseudoword_exact_match_ar_full
    - wfe_pseudoword_edit_distance_ar_full
    - wfe_pseudoword_normalized_edit_distance_ar_full
    - length_effect_slope_pseudoword_edit_ar_full
    - long_short_contrast_pseudoword_edit_ar_full
  diagnostics:
    # NOT used for model selection; used for understanding only
    - teacher_forced_ceiling_all_routes
    - route_wm_exact_ar
    - route_ltm_exact_ar
    - gate_confidence_distribution_real_vs_pseudowords
    - serial_position_curve_full_ar
    - error_type_counts_full_ar
    - wm_noise_sweep_full_ar
    - ssp_ar_secondary

  selection_policy: |
    FULL-ONLY SELECTION RULE:
    WM and LTM route-isolated metrics are diagnostic information.
    They must NOT be used to select or reject training configurations.
    Rationale: the cognitive model's output is the FULL/gated route.
    WM-only and LTM-only reflect incomplete processing and are not
    interpretable as behavioral predictions.

