    status: PENDING_IMPLEMENTATION
    files: [models/ltm_route.py, config.py]
    description: "Add use_last_hidden=True option to LTMConfig; replace masked mean pool with h[-1] in encode(); change to_semantic[0] input dim from 2*H to H"
    blocks: phase4

  - name: hidden_size_cli_flag
    status: PENDING_IMPLEMENTATION
    files: [scripts/train_checkpoint.py, config.py]
    description: "Add --hidden_size INT that sets WMConfig.hidden, LTMConfig.enc_hidden, LTMConfig.dec_hidden uniformly"
    blocks: phase4

  - name: gate_threshold_config
    status: PENDING_IMPLEMENTATION
    files: [config.py, models/gating.py, scripts/train_checkpoint.py]
    description: "Add gate_threshold: float = 0.5 to GatingConfig; replace literal 0.5 in gating.py:45 with self.cfg.gate_threshold; add --gate_threshold CLI"
    blocks: phase7_only

  - name: ventral_noise_ltm
    status: PENDING_IMPLEMENTATION
    files: [config.py, models/ltm_route.py, scripts/train_checkpoint.py]
    description: "Add LTMConfig.ventral_noise: float = 0.0; inject noise after pooled in encode() analogous to WM noise; add --ventral_noise CLI"
    blocks: phase6_only

  - name: encode_once_tf_less_than_1
    status: PENDING_IMPLEMENTATION
    files: [train.py]
    description: "In _forward_scheduled_sampling: run both encoders ONCE before decode loop; pass h_WM and s_hat into steps without re-encoding. Required to fix noise semantics with TF<1 (currently S independent noise draws instead of 1)"
    blocks: phase6_with_tf_less_than_1

  - name: mid_training_checkpoint
    status: PENDING_IMPLEMENTATION
    files: [scripts/train_checkpoint.py]
    description: "Save checkpoint every N epochs to survive Jean-Zay job interruption"
    blocks: phase3_jz

  - name: dataloader_num_workers
    status: PENDING_IMPLEMENTATION
    files: [data/dataset.py]
    description: "Add num_workers=4 to make_loader() for GPU server performance"
    blocks: phase3_jz

  - name: aggregate_gridsearch_script
    status: PENDING_IMPLEMENTATION
    files: [scripts/aggregate_gridsearch.py (new)]
    description: "Script to read all gridsearch metrics.json files, rank by FULL-route AR metrics only"
    blocks: phase4_analysis

confirmed_by_inspection:
  # Source: config.py, train.py, train_checkpoint.py, losses.py, data/dataset.py
  optimizer: AdamW  # torch.optim.AdamW, train.py:102
  optimizer_betas: [0.9, 0.999]  # PyTorch defaults
  weight_decay: 1.0e-5  # config.py:TrainConfig.weight_decay
  grad_clip: 1.0  # config.py:TrainConfig.grad_clip
  batch_size: 64  # config.py:TrainConfig.batch_size, CLI: --batch_size
  lr_default: 1.0e-3  # config.py:TrainConfig.lr, CLI: --lr
  val_fraction: 0.15  # config.py:DataConfig.val_fraction
  split_seed: "same as --seed flag (not separate)"
  dropout: NOT_IMPLEMENTED  # no dropout in any model module
  scheduler: NONE  # no LR scheduler in current code
  training_regime: "teacher_forcing_ratio=1.0 default (full TF); scheduled sampling IMPLEMENTED (see train.py:_forward_scheduled_sampling); --teacher_forcing_ratio CLI flag AVAILABLE"
  loss_rep: 1.0  # config.py:LossConfig.rep
  loss_align: 1.0  # config.py:LossConfig.align (semantic alignment)
  loss_dec: 0.5  # config.py:LossConfig.dec (LTM form regeneration CE)
  loss_wm: 0.5  # config.py:LossConfig.wm (WM-only CE)
  loss_gate: 0.05  # config.py:LossConfig.gate (gate usage regularizer)
  loss_label_smoothing: 0.0
  usage_prior: 0.5  # config.py:GatingConfig.usage_prior
  dorsal_pool_size: 4000  # config.py:TrainConfig.dorsal_pool_size
  checkpoint_selection_criterion: NONE  # no auto-selection, no early stopping
  train_val_split_seed: "same as --seed CLI flag"
  checkpoint_saved_keys:
    - model_state_dict
    - optimizer_state_dict
    - rng_states
    - cfg_data / cfg_wm / cfg_ltm / cfg_gating / cfg_loss / cfg_train
    - history
    - git_commit
    - total_epochs_trained
    - lr_at_save

